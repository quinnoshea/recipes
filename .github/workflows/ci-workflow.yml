name: CI - Recipes Monorepo

on:
  push:
    branches: [ personal-env ]
  pull_request:
    branches: [ personal-env ]

jobs:
  backend:
    name: Django Backend Checks
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [ '3.11', '3.12' ] # Recommended to focus on a few recent versions

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install ruff bandit mypy django djangorestframework psycopg2-binary

    - name: Run linting with ruff
      run: |
        ruff check recipes/ cookbook/

    - name: Run security check with bandit
      run: |
        bandit -r recipes/ cookbook/

    - name: Run type checking with mypy
      run: |
        mypy recipes/ cookbook/

    - name: Run Django tests
      run: |
        # This assumes your Django tests can be run via 'manage.py test'
        python recipes/manage.py test

  frontend:
    name: Vue.js Frontend Checks
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20' # Use a recommended LTS version

    - name: Install Node.js dependencies
      run: |
        npm install
      working-directory: ./vue3/

    - name: Run linting with ESLint
      run: |
        npm run lint
      working-directory: ./vue3/

    - name: Run Vue.js tests
      run: |
        npm run test
      working-directory: ./vue3/

  codacy-analysis:
    name: Codacy Static Analysis
    runs-on: ubuntu-latest
    needs: [backend, frontend] # This job depends on the success of the others
    if: github.event_name == 'push'
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Run Codacy Analysis
      uses: codacy/codacy-analysis-cli-action@1.0.0 # Use the official action
      with:
        project-token: ${{ secrets.CODACY_PROJECT_TOKEN }}
